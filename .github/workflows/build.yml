name: Build package
on:
  pull_request:
  push:
    branches: [master]

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: dtolnay/rust-toolchain@stable
      - name: Build and install release extension
        run: python -m pip install --verbose --editable .
      - name: Install validation dependencies
        run: python -m pip install pytest scipy numba
      - name: Run numerical and API tests
        run: python -m pytest -q tests/test_model.py tests/test_item.py tests/test_observation_ordinal.py tests/test_fitter.py tests/test_kernel.py tests/test_kernel_equiv.py validation/test_native_boundary.py -k "not test_batch_prediction_does_not_build_test_covariance"
      - name: Run inference regressions
        run: python -m pytest -q tests/test_inference_regressions.py -k "probit_tie_against_quadrature or logit_extreme_finite_inputs or probit_zero_margin_prediction or zero_variance_cannot_report_convergence or cached_allocation_matches_kernel_at_absolute_times"
